name: board-binaries

# The board binary, built for every platform the fleet runs on and attached to
# each release, so a machine needs no install script and no bun to have a
# board. hooks/board-binary.sh fetches the asset for its own platform and
# plugin version at session start and checks it against SHA256SUMS.
#
# Every target is cross-compiled from one Linux runner with Bun's compile
# targets; macOS on Intel is deliberately not built. A pull request that
# touches the board builds all five as a check and publishes nothing; a
# vX.Y.Z tag builds them and attaches them, gzipped, to that tag's release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'claude/coder-fleet/board/**'
      - 'claude/coder-fleet/hooks/board-binary.sh'
      - '.github/workflows/board-binaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: board-darwin-arm64
          - target: bun-linux-x64
            asset: board-linux-x64
          - target: bun-linux-arm64
            asset: board-linux-arm64
          - target: bun-windows-x64
            asset: board-windows-x64.exe
          - target: bun-windows-arm64
            asset: board-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      # The version the checks workflow and board/bun.lock are on.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build ${{ matrix.target }}
        working-directory: claude/coder-fleet/board
        env:
          BOARD_BUILD_TARGET: ${{ matrix.target }}
        run: ./build.sh "$RUNNER_TEMP/${{ matrix.asset }}"
      # The runner can run one of the five; it proves the build starts and
      # reports the version it embedded.
      - name: Run the native build
        if: matrix.target == 'bun-linux-x64'
        run: '"$RUNNER_TEMP/${{ matrix.asset }}" --version'
      - name: Compress
        run: gzip -9 -c "$RUNNER_TEMP/${{ matrix.asset }}" > "$RUNNER_TEMP/${{ matrix.asset }}.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}.gz
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum board-*.gz > SHA256SUMS && cat SHA256SUMS
      # The tag is pushed after its pull request merges (AGENTS.md,
      # "Releasing"), so the release may not exist yet. Create it, or add to
      # the one that does; --clobber makes a re-run replace its own assets.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Board binaries for $TAG. The plugin fetches the one for its platform at session start."
          gh release upload "$TAG" assets/board-*.gz assets/SHA256SUMS --clobber
