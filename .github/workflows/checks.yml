name: checks

# The deterministic half of the eval story: every contract, parity, roster and
# workflow-logic check, no model, no network at run time, and no real GitHub:
# the board hooks run against fake-gh. The smoke evals (evals/run.sh) stay
# manual - they call claude -p, which needs a key and a budget that a public
# CI run should not carry.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    # Before the board moved to GitHub issues a run, with the board package's
    # own tests, took 2.5 min at most; this is four times that.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The OpenCode port's tests run under bun, through opencode/test/run.sh,
      # which fails rather than skips without it when CI is set. Pinned so a
      # new bun release cannot change a green run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The OpenCode port's live tests read the behaviour of the 2.x release
      # the port targets, so the binary is pinned to it. 2.x is published as
      # @opencode/cli, the package the official v2 installer downloads from;
      # opencode-ai carries only 1.x. Install scripts stay on: the package's
      # postinstall puts the platform binary in place, and without it the
      # binary refuses to run.
      - name: Install the OpenCode binary the port targets
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --no-audit --no-fund @opencode/cli@2.0.32
          echo "OPENCODE_BIN=$RUNNER_TEMP/opencode/node_modules/.bin/opencode" >> "$GITHUB_ENV"
      - name: Every deterministic check
        run: bash claude/evals/lib/check-all.sh
      # The slow checks the TaskCompleted gate leaves out (CF-56). Run here so
      # nothing in either suite goes unrun.
      - name: The slow deterministic checks
        if: ${{ !cancelled() }}
        run: bash claude/evals/lib/check-slow.sh
